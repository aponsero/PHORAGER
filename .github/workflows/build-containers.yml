name: Build and push containers

# Builds the two custom PHORAGER containers and pushes them to GitHub
# Container Registry (ghcr.io). Runs on manual dispatch, or automatically
# when a Dockerfile (or this workflow) changes.
on:
  workflow_dispatch:
  push:
    paths:
      - 'containers/**'
      - '.github/workflows/build-containers.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: parsing-env
            dockerfile: containers/parsing-env/Dockerfile
            tag: '1.0'
          - name: checkv-bundle
            dockerfile: containers/checkv-bundle/Dockerfile
            tag: '1.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/phorager-${{ matrix.name }}:${{ matrix.tag }}